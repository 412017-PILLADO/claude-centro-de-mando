<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <title>Centro de mando</title>
    <link rel="stylesheet" href="estilos.css" />
    <link rel="stylesheet" href="tokens.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div id="agarre-alto" class="agarre-alto" title="Arrastrá para cambiar el alto · doble clic: tamaño automático"><span></span></div>

      <div id="panel" class="panel">
        <div id="panel-contenido">
        <nav class="riel" aria-label="Vistas">
          <button id="vista-centro" title="Centro" aria-label="Centro">▦</button>
        </nav>
        <div id="vista-trabajo">
        <section class="bloque seccion" data-seccion="reuniones">
          <div class="encabezado">
            <span class="icono-caja" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4" /></svg></span>
            <div class="titulo-texto"><h2>Reuniones</h2><p id="sub-reuniones" class="subtitulo" hidden></p></div>
            <details class="mas-seccion"><summary class="boton-circulo" aria-label="Más opciones de reuniones">•••</summary><button id="btn-probar" class="boton-chico">Probar alerta</button></details>
            <button class="seccion-titulo pastilla-plegar" aria-label="Plegar Reuniones" aria-expanded="true" aria-controls="cuerpo-reuniones" title="Plegar">
              <span id="cuenta-reuniones" class="cuenta"></span>
              <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
          <div class="plegable" id="cuerpo-reuniones"><div class="plegable-int"><div class="seccion-cuerpo" id="reuniones"></div></div></div>
        </section>

        <section class="bloque seccion" data-seccion="tickets">
          <div class="encabezado">
            <span class="icono-caja" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1zM14 5v14" /></svg></span>
            <div class="titulo-texto"><h2>Mis tickets</h2><p id="sub-tickets" class="subtitulo" hidden></p></div>
            <button class="seccion-titulo pastilla-plegar" aria-label="Plegar Mis tickets" aria-expanded="true" aria-controls="cuerpo-tickets" title="Plegar">
              <span id="cuenta-tickets" class="cuenta"></span>
              <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
          <div class="plegable" id="cuerpo-tickets"><div class="plegable-int"><div class="seccion-cuerpo">
              <div id="filtros" class="filtros"></div>
              <div id="tickets"></div>
            </div></div></div>
        </section>

        <section class="bloque seccion" data-seccion="sesiones">
          <div class="encabezado">
            <span class="icono-caja" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4zM8 20h8M12 16v4" /></svg></span>
            <div class="titulo-texto"><h2>Sesiones de Claude</h2><p id="sub-sesiones" class="subtitulo" hidden></p></div>
            <button class="seccion-titulo pastilla-plegar" aria-label="Plegar Sesiones de Claude" aria-expanded="true" aria-controls="cuerpo-sesiones" title="Plegar">
              <span id="cuenta-sesiones" class="cuenta"></span>
              <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
          <div class="plegable" id="cuerpo-sesiones"><div class="plegable-int"><div class="seccion-cuerpo" id="sesiones"></div></div></div>
        </section>
        </div>
        </div>
      </div>

      <div id="agarre-ancho" class="agarre-ancho" title="Arrastrá para cambiar el ancho · doble clic: tamaño automático"></div>
    </div>
    <script src="secciones.js"></script>
    <script src="app.js"></script>
  </body>
</html>
